name: tubetocd-client

services:
  tubetocd-client:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3024}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3025}
    image: tubetocd-client
    container_name: tubetocd-client
    ports:
      - "3024:3024"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3024"]
      interval: 30s
      timeout: 10s
      retries: 3
