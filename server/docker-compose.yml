services:
  app:
    build: .
    container_name: tubetocd-api
    ports:
      - "3025:3025"
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3025
      - DATABASE_PATH=/app/data/database.sqlite
    volumes:
      - sqlite_data:/app/data
      - downloads_data:/app/downloads
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3025/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  sqlite_data:
  downloads_data:
