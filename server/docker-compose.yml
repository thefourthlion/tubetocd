services:
  tubetocd-api:
    build: .
    image: tubetocd-api
    container_name: tubetocd-api
    ports:
      - "3025:3025"
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3025
      - DATABASE_PATH=/app/data/database.sqlite
    volumes:
      # Persist SQLite on the host next to compose (server/data/)
      - ./data:/app/data
      - ./downloads:/app/downloads
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3025/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
